name: portfolio

services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      ENVIRONMENT: development
      DEBUG: "true"
      # ── Admin credentials ──────────────────────────────────────────────────
      # Set ADMIN_EMAIL to whatever login email you want.
      # Set ADMIN_PASSWORD_HASH to the output of:
      #   python -m app.cli.hash_password
      # Set ADMIN_JWT_SECRET to any random string >= 32 chars, e.g.:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: ""
      ADMIN_JWT_SECRET: "local-dev-secret-change-me-32-chars-min!!"
      ADMIN_JWT_ISSUER: api.brensaud.com
      ADMIN_JWT_AUDIENCE: admin.brensaud.com
      ADMIN_JWT_ACCESS_TTL_MINUTES: "15"
      ADMIN_REFRESH_TTL_SECONDS: "86400"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount source for hot-reload in development
      - ./app:/app/app
    command: >
      sh -c "/app/.venv/bin/alembic upgrade head &&
             /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
