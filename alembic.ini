# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template for new revision files
file_template = %%(rev)s_%%(slug)s

# Timezone for 'create date' in migration files
timezone = UTC

# sys.path is prepended with this to allow model imports
prepend_sys_path = .

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
