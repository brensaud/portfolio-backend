[project]
name = "backend"
version = "0.1.0"
description = "Portfolio backend — FastAPI contact API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.4",
    "asyncpg>=0.31.0",
    "email-validator==2.3.0",
    "fastapi==0.138.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.1.1",
    "redis==6.2.0",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # function calls in default args (FastAPI Depends pattern)
